name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # "Run workflow" on main publishes v<version-name> from metadata.json (no tag push needed)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck libglib2.0-bin
      - run: for t in extension/*.test.mjs; do node "$t"; done
      - run: shellcheck install.sh install-stub.sh build.sh
      - run: bash build.sh && (cd dist && sha256sum dock-install.sh ./*.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="v$(python3 -c 'import json; print(json.load(open("extension/metadata.json"))["version-name"])')"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Publish releases from main only"; exit 1; }
            tag="$want"
          else
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == "$want" ]] || { echo "Tag $tag does not match metadata version-name ($want)"; exit 1; }
          fi
          files=(dist/dock-install.sh dist/*.deb dist/SHA256SUMS)
          # Release drafted in the GitHub UI already exists: attach the files to it.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            # creates the tag on this commit when it does not exist yet (manual run)
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --generate-notes
          fi
