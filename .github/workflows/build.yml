name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck libglib2.0-bin
      - run: for t in extension/*.test.mjs; do node "$t"; done
      - run: shellcheck install.sh install-stub.sh build.sh
      - run: bash build.sh && (cd dist && sha256sum dock-install.sh ./*.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="v$(python3 -c 'import json; print(json.load(open("extension/metadata.json"))["version-name"])')"
          [[ "$GITHUB_REF_NAME" == "$want" ]] || { echo "Tag $GITHUB_REF_NAME does not match metadata version-name ($want)"; exit 1; }
          files=(dist/dock-install.sh dist/*.deb dist/SHA256SUMS)
          # Release drafted in the GitHub UI already exists: attach the files to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes
          fi
