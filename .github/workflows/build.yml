name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # "Run workflow" on main publishes a release (no tag push needed). With a version, it first sets
  # metadata.json to that version and commits it to main; empty publishes the current version.
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, for example 1.2.1 (leave empty to publish the version already in metadata.json)'
        required: false
        type: string

concurrency:
  # releases get their own group, so a push to main cannot cancel one; a newer push only replaces an
  # older check of the same branch
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Starts a headless GNOME Shell with the extension, flips every setting, disables and re-enables
  # it, and fails on any error the shell logs (ci/smoke.sh).
  smoke:
    name: GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gnome: '46', image: 'ubuntu:24.04'}
          - {gnome: '47', image: 'registry.fedoraproject.org/fedora:41'}
          - {gnome: '48', image: 'registry.fedoraproject.org/fedora:42'}
          - {gnome: '49', image: 'registry.fedoraproject.org/fedora:43'}
          - {gnome: '50', image: 'registry.fedoraproject.org/fedora:44'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GNOME Shell
        # bash, not the container default sh: ubuntu's sh is dash, which has no [[ ]]
        shell: bash
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False \
              gnome-shell gjs dbus-daemon dbus-tools dconf gvfs glib2 python3 tar
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              gnome-shell gjs dbus-daemon dconf-service libglib2.0-bin gvfs gvfs-daemons python3
          fi
          v=$(gnome-shell --version)
          [[ "$v" == *"Shell ${{ matrix.gnome }}."* ]] || { echo "$v, expected GNOME ${{ matrix.gnome }}"; exit 1; }
      - run: bash ci/smoke.sh

  build:
    needs: smoke
    runs-on: ubuntu-24.04
    # pushes the version commit and publishes the release; everything else only reads
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck libglib2.0-bin
      - name: Set the release version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Publish releases from main only"; exit 1; }
          python3 ci/bump.py "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release v$(python3 -c 'import json; print(json.load(open("extension/metadata.json"))["version-name"])')"
          git push origin HEAD:main
      - run: for t in extension/*.test.mjs; do node "$t"; done
      - name: shellcheck
        run: |
          shellcheck install.sh install-stub.sh build.sh ci/smoke.sh
          # the updater's install script lives in a JS template string
          sed -n '/^const SCRIPT = `/,/`;$/{s/^const SCRIPT = `//;s/`;$//;s/\\\\/\\/g;p}' extension/updater.js | shellcheck -s bash -
      - run: python3 ci/bump_test.py
      - run: bash build.sh && (cd dist && sha256sum dock-install.sh ./*.deb > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
      # Signing SHA256SUMS (off until a key exists, see CONTRIBUTING.md "Signing releases"). To turn on:
      # add the MINISIGN_KEY secret, uncomment this step and add dist/SHA256SUMS.minisig to files below.
      # - name: Sign SHA256SUMS
      #   env:
      #     MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
      #   run: |
      #     sudo apt-get install -y --no-install-recommends minisign
      #     printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
      #     minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS < /dev/null
      #     rm -f "$RUNNER_TEMP/minisign.key"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="v$(python3 -c 'import json; print(json.load(open("extension/metadata.json"))["version-name"])')"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Publish releases from main only"; exit 1; }
            tag="$want"
          else
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == "$want" ]] || { echo "Tag $tag does not match metadata version-name ($want)"; exit 1; }
            # main contains the tag commit: "behind" or "identical", never "ahead" or "diverged"
            on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
            [[ "$on_main" == behind || "$on_main" == identical ]] || { echo "Tag $tag is not on main ($on_main)"; exit 1; }
          fi
          files=(dist/dock-install.sh dist/*.deb dist/SHA256SUMS)
          # Release drafted in the GitHub UI already exists: attach the files to it.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            # a re-run must never replace the files of a release people already downloaded
            [[ "$draft" == true ]] || { echo "Release $tag is already published; bump the version instead"; exit 1; }
            gh release upload "$tag" "${files[@]}" --clobber
          else
            # creates the tag on this commit (the version commit, if one was just made)
            gh release create "$tag" "${files[@]}" --target "$(git rev-parse HEAD)" --generate-notes
          fi
